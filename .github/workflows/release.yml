# Releases the theme when a `v<version>` tag is pushed.
#
# The catalog lists a theme only if its tarball is an asset of an immutable
# release made by this workflow, on a GitHub-hosted runner, for the release's
# own tag, and carries an attestation from that run (see "The release workflow
# runs on the tag" in the plugin contract of openbrf/openbrf). So this starts
# on the tag push and nowhere else: a run on main, or one started by hand,
# would make an attestation the catalog refuses.
#
# To release: set `version` in theme.json and package.json in a pull request,
# merge it, then push the tag from the merged commit:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Create no release in the GitHub UI first. Publishing a release with a new tag
# creates the tag, the tag push then starts this workflow after the release is
# already immutable, and the upload of the tarball fails.
#
# The tarball is packed once, attested, and attached to the release before the
# release is published, because the assets of an immutable release cannot
# change afterwards.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Pack, attest and release
    runs-on: ubuntu-latest
    permissions:
      # Create the release and upload the tarball.
      contents: write
      # Attest the tarball.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Whole history, to tell whether the tagged commit is on main.
          fetch-depth: 0
          # Nothing here pushes, so the token has no reason to sit in the
          # runner's git config where later steps and scripts can read it.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # A tag is cheap to push from anywhere, so the run refuses one that is
      # not main's own commit and one that does not match the version the
      # manifest states.
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main. Merge the release first, then tag the merged commit."
            exit 1
          fi
          version=$(node -p 'require("./theme.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag is $TAG but theme.json states version $version."
            exit 1
          fi
          if [ "$(node -p 'require("./package.json").version')" != "$version" ]; then
            echo "::error::package.json and theme.json state different versions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Pack
        id: pack
        run: |
          file=$(node scripts/pack.mjs)
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Attest the tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.file }}

      # Created as a draft, so the tarball is attached before the release is
      # published and becomes immutable.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          gh release create "$TAG" "$FILE" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes "Release $TAG of the Open BRF example theme. Verify the tarball with: gh attestation verify $(basename "$FILE") --repo $GITHUB_REPOSITORY --source-ref refs/tags/$TAG"
          gh release edit "$TAG" --draft=false

      # What a catalog entry for this release states.
      - name: Report the digest
        env:
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          {
            echo "### $(basename "$FILE")"
            echo
            echo "- sha512: \`$(sha512sum "$FILE" | cut -d' ' -f1)\`"
            echo "- bytes: \`$(stat -c %s "$FILE")\`"
          } >> "$GITHUB_STEP_SUMMARY"
